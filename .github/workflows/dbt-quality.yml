name: pipeline quality

on:
  push:
  pull_request:

jobs:
  pipeline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shell syntax and reject invalid calendar dates
        run: |
          bash -n run.sh
          if ./run.sh --start-date 2024-02-30; then
            echo "Expected an invalid calendar date to be rejected." >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Generate deterministic two-day CSV fixture
        run: python scripts/create_ci_fixture.py "$RUNNER_TEMP/ci_candles.csv"
      - name: Run the full ingestion and dbt workflow
        env:
          DATA_FILE: ${{ runner.temp }}/ci_candles.csv
          POSTGRES_PASSWORD: ci-only-password
        run: ./run.sh --reload
      - name: Assert smoke-test row counts and outcomes
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U bitcoin -d bitcoin -f /dev/stdin < tests/fixtures/assert_ci_results.sql
      - name: Preserve dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-quality-artifacts
          if-no-files-found: ignore
          path: |
            target/manifest.json
            target/run_results.json
            target/build_run_results.json
            logs/dbt.log
      - name: Stop Compose services
        if: always()
        run: docker compose down --remove-orphans
