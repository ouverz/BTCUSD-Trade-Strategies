services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitcoin}
      POSTGRES_USER: ${POSTGRES_USER:-bitcoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitcoin}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitcoin} -d ${POSTGRES_DB:-bitcoin}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ${DATA_FILE:-./data.csv}:/data/input.csv:ro

  dbt:
    build: .
    environment:
      DBT_PROFILES_DIR: /usr/app
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bitcoin}
      POSTGRES_USER: ${POSTGRES_USER:-bitcoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitcoin}
    volumes:
      - .:/usr/app
    depends_on:
      postgres:
        condition: service_healthy

